<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1016">
  <meta name="referrer" content="no-referrer">
  <title>Choose a model · Shared Inference</title>

  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/nodes/model/styles.css">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
</head>

<body class="page">
  <!-- Navigation -->
  <header class="header">
    <a class="logo" href="/" aria-label="Shared Inference — home"><img src="/assets/logo.png" alt="" width="32" height="32"></a>
    <nav aria-label="Account"><a class="account" href="/login/">Account</a></nav>
  </header>

  <main class="pick">
    <div class="card">
      <!-- Which node -->
      <p class="node" id="node" hidden><span class="status"></span><strong id="node-name"></strong> · <span id="node-state"></span></p>
      <h1>Choose a model</h1>
      <p class="lead" id="node-memory">Loading your node…</p>

      <!-- Models -->
      <form id="pick" hidden>
        <fieldset id="models">
          <legend class="sr-only">Models</legend>
        </fieldset>
        <button class="primary" type="submit" id="use">Use this model</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </div>

    <a class="below" href="/nodes/">← All nodes</a>
  </main>

  <template id="option">
    <label class="option">
      <input type="radio" name="model" required>
      <span class="option-text"><strong></strong><small></small></span>
      <span class="fit"></span>
    </label>
  </template>

  <script type="module" src="/nodes/model/script.js"></script>
</body>

</html>
